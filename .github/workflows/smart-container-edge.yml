name: Smart-container Edge collection

on:
  push:
    branches: [main, master]
    paths:
      - "automation/SmartContainer.EdgeCollector/**"
      - ".github/workflows/smart-container-edge.yml"
  schedule:
    # 01:10 UTC is 09:10 in Asia/Shanghai. Avoid the crowded top of the hour
    # and allow the external WPS editor to finish its daily update first.
    - cron: "10 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Collect and validate without importing into the server"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: smart-container-edge-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      SMART_CONTAINER_SOURCE_KEY: taicang
      SMART_CONTAINER_PORT_NAME: 太仓港
      SMART_CONTAINER_SOURCE_URL: https://www.kdocs.cn/l/cnTbqZoPh8FG
      SMART_CONTAINER_WORKSHEETS: 太仓,内河点
      SMART_CONTAINER_IMPORT_URL: ${{ secrets.SMART_CONTAINER_IMPORT_URL }}
      SMART_CONTAINER_IMPORT_SECRET: ${{ secrets.SMART_CONTAINER_IMPORT_SECRET }}
      # Initial push and scheduled runs import immediately. Manual runs can be dry runs.
      SMART_CONTAINER_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      SMART_CONTAINER_OUTPUT_DIR: artifacts/smart-container-run
      # Re-read the full workbook when WPS is caught between two source dates.
      SMART_CONTAINER_VALIDATION_RETRY_COUNT: 2
      SMART_CONTAINER_VALIDATION_RETRY_DELAY_SECONDS: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify Microsoft Edge
        shell: pwsh
        run: |
          $edgeCandidates = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          )
          $edgePath = $edgeCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $edgePath) { throw "Microsoft Edge is not installed on this runner." }
          "EDGE_EXECUTABLE_PATH=$edgePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $edgePath --version

      - name: Collect and validate WPS data
        run: dotnet run --configuration Release --project automation/SmartContainer.EdgeCollector/SmartContainer.EdgeCollector.csproj

      - name: Upload collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-container-edge-${{ github.run_id }}
          path: artifacts/smart-container-run
          if-no-files-found: warn
          retention-days: 14
